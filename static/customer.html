<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your orders · ReturnGuard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=4">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }
/* header */
.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top .inner { max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 32px; }
.nav { display: flex; gap: 4px; height: 100%; }
.nav a { display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a:hover { color: var(--ink); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--brand); border-bottom-color: var(--brand); }
.account { margin-left: auto; position: relative; }
.account-btn { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; padding: 4px 6px 4px 4px; border-radius: 8px; cursor: pointer; }
.account-btn:hover { background: var(--subtle); border-color: var(--line); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.menu { position: absolute; right: 0; top: 46px; min-width: 220px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; }
.menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.menu button:hover { background: var(--subtle); color: var(--ink); }
@media (max-width: 720px) {  /* phones: the section links move to a bottom tab bar */
  .top .inner { gap: 12px; padding: 0 16px; height: 56px; } .account-btn .nm { display: none; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
         background: #fff; border-top: 1px solid var(--line); gap: 0; z-index: 30; box-shadow: 0 -1px 3px rgba(16, 24, 40, .04); }
  .nav a { flex: 1; flex-direction: column; justify-content: center; gap: 2px; padding: 0; margin: 0; border: 0; font-size: 11px; }
  .nav a svg { box-sizing: content-box; padding: 4px 18px; border-radius: 999px; transition: background .15s; }
  .nav a[aria-current="page"] { color: var(--brand); font-weight: 600; }
  .nav a[aria-current="page"] svg { background: var(--brand-soft); }  /* pill behind the active icon, as in most mobile apps */
  body { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  .site-footer { display: none; }  /* the tab bar replaces it; the policy is linked from Help */
}

main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; display: grid; gap: 24px; align-content: start; }
@media (max-width: 720px) { main { padding: 24px 16px 48px; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { color: var(--ink-2); margin-top: 4px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs a { color: var(--ink-2); }
.crumbs svg { width: 14px; height: 14px; }

/* orders */
.order { display: grid; grid-template-columns: 96px 1fr auto; gap: 20px; padding: 20px; align-items: center; }
.order + .order { border-top: 1px solid var(--line); }
.thumb { width: 96px; height: 96px; border-radius: 8px; background: var(--subtle); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.sm { width: 48px; height: 48px; border-radius: 6px; }
.order h3 { font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.window { margin-top: 8px; font-size: 13px; }
.window.ok { color: var(--ok); } .window.closed { color: var(--ink-3); }
.order .side { display: grid; justify-items: end; gap: 10px; }
.price { font-weight: 600; }
@media (max-width: 720px) { .order { grid-template-columns: 64px 1fr; } .order .thumb { width: 64px; height: 64px; } .order .side { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; align-items: center; } }

/* two-column pages */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.phone-only { display: none; }
.table td.mono { white-space: nowrap; }
@media (max-width: 640px) {
  .wide-only { display: none; }
  .phone-only { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .table th, .table td { padding-left: 16px; padding-right: 16px; }
}
.stack { display: grid; gap: 24px; }
.summary .card-body { display: grid; gap: 14px; }
.summary .item { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.summary .item .thumb { width: 64px; height: 64px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; text-align: right; color: var(--ink); }
.steps-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 13px; color: var(--ink-2); counter-reset: s; }
.steps-list li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; }
.steps-list li::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 600; font-size: 12px; display: grid; place-items: center; }

/* return form */
.form-section { padding: 24px; display: grid; gap: 16px; }
.form-section + .form-section { border-top: 1px solid var(--line); }
.form-section h2 { font-size: 16px; display: flex; gap: 10px; align-items: center; }
.form-section h2 .n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 12px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.reasons { display: grid; gap: 8px; }
.reason { display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 400; }
.reason:hover { background: var(--subtle); }
.reason input { margin: 3px 0 0; accent-color: var(--brand); width: 16px; height: 16px; }
.reason:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.reason b { display: block; font-weight: 500; }
.reason span { font-size: 13px; color: var(--ink-3); }
.counter { text-align: right; font-size: 12px; color: var(--ink-3); }
.drop { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 24px; text-align: center; background: var(--subtle); cursor: pointer; display: grid; justify-items: center; gap: 6px; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .ic { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.drop b { color: var(--brand); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 6px; font-size: 12px; align-content: start; }
.tile .im { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--subtle); }
.tile .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .rm { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 6px; border: 0; background: rgba(16, 24, 40, .7); color: #fff; display: grid; place-items: center; cursor: pointer; }
.tile .rm svg { width: 14px; height: 14px; }
.tile .st { display: flex; align-items: flex-start; gap: 5px; line-height: 1.35; }
.tile .st.ok { color: var(--ok); } .tile .st.warn { color: var(--warn); } .tile .st.bad { color: var(--bad); }
.tile .st svg { width: 14px; height: 14px; margin-top: 1px; }
.tile.bad .im { border-color: var(--bad-line); } .tile.bad img { opacity: .55; }
.tile.warn .im { border-color: var(--warn-line); }
.tile.ok .im { border-color: var(--ok-line); }
.form-foot { padding: 20px 24px; border-top: 1px solid var(--line); display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; background: var(--subtle); }

/* return detail */
.outcome { padding: 24px; display: grid; grid-template-columns: 44px 1fr; gap: 16px; }
.outcome .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.outcome .ic svg { width: 22px; height: 22px; }
.outcome.ok .ic { background: var(--ok-bg); color: var(--ok); } .outcome.warn .ic { background: var(--warn-bg); color: var(--warn); }
.outcome.info .ic { background: var(--info-bg); color: var(--info); } .outcome.bad .ic { background: var(--bad-bg); color: var(--bad); }
.outcome h2 { font-size: 18px; }
.outcome p { color: var(--ink-2); margin-top: 6px; }
.outcome .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.progress { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; font-size: 13px; }
.progress li { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
.progress .done svg { color: var(--ok); width: 16px; height: 16px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::after { content: ""; position: absolute; left: 11px; top: 26px; bottom: 2px; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--line-strong); }
.timeline .dot svg { width: 12px; height: 12px; stroke-width: 3; }
.timeline .done .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
.timeline .now .dot { border-color: var(--brand); }
.timeline .now .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.timeline b { font-weight: 500; display: block; }
.timeline span { font-size: 13px; color: var(--ink-3); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 14px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
.checks .ok svg { color: var(--ok); } .checks .warn svg { color: var(--warn); }

/* returns table */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 12px 20px; background: var(--subtle); border-bottom: 1px solid var(--line); }
.table td { padding: 14px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { cursor: pointer; } .table tbody tr:hover td { background: var(--subtle); }
.item-cell { display: flex; align-items: center; gap: 12px; }
.tablewrap { overflow-x: auto; }

/* help */
details.faq { padding: 16px 20px; border-bottom: 1px solid var(--line); }
details.faq:last-child { border-bottom: 0; }
details.faq summary { cursor: pointer; font-weight: 500; }
details.faq p { color: var(--ink-2); margin-top: 8px; max-width: 70ch; }
/* doorstep pickup */
.pickup-code { margin-top: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px;
               border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--subtle); }
.pickup-code > div { display: grid; gap: 2px; }
.pickup-code .code { font-size: 26px; font-weight: 600; letter-spacing: .3em; color: var(--ink); }
.pickup-code p { flex: 1; min-width: 180px; }
.kv.refund { margin-top: 12px; max-width: 360px; }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <span id="logo"></span>
    <nav class="nav" aria-label="Main">
      <a href="#orders" data-nav="orders" id="nav-orders"></a>
      <a href="#returns" data-nav="returns" id="nav-returns"></a>
      <a href="#help" data-nav="help" id="nav-help"></a>
    </nav>
    <div class="account">
      <button class="account-btn" id="acct" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<input type="file" id="picker" accept="image/jpeg,image/png,image/webp" multiple hidden>
<script src="/static/app.js?v=4"></script>
<script>
let me = null, orders = [], cfg = {max_photos: 4, max_evidence_rounds: 2, return_window_days: 10}, pollTimer = null;
let draft = [], pickerTarget = null;
// key, label, hint, needs a description
const REASONS = [
  ["damaged", "It arrived damaged or defective", "A hole, tear, split seam or other fault.", true],
  ["stain", "It has a stain or discolouration", "Marks, spots or colour that has run.", true],
  ["wrong", "It's not the item I ordered", "A different product, size or colour arrived.", true],
  ["fit", "It doesn't fit", "Unworn, with the original tags.", false],
  ["mind", "I changed my mind", "Unworn, with the original tags.", false],
];
const STEP_LABEL = {get_order: "Order verified", parse_claim: "Return reason reviewed", check_photos: "Photo quality checked",
  verify_product: "Item matched to your order", detect_defects: "Garment inspected for damage", zoom_in: "Detailed inspection",
  verify_with_vlm: "Damage independently confirmed", retrieve_policy: "Return policy applied", decide: "Decision made", finalize: "Done"};
const PROBLEM = {too_small: "Too small", blurry: "Blurry", too_dark: "Too dark", too_bright: "Too bright"};

$("logo").innerHTML = logoHTML(false, "/account");
$("nav-orders").innerHTML = `${icon("package")}<span>Orders</span>`;
$("nav-returns").innerHTML = `${icon("return")}<span>Returns</span>`;
$("nav-help").innerHTML = `${icon("help")}<span>Help</span>`;
document.body.insertAdjacentHTML("beforeend", footerHTML());

function setNav(key) { document.querySelectorAll("[data-nav]").forEach((a) => a.setAttribute("aria-current", a.dataset.nav === key ? "page" : "false")); }
const orderOf = (id) => orders.find((o) => o.order_id === id) || {};
const thumbHTML = (img, cls = "") => `<div class="thumb ${cls}">${img ? `<img src="${esc(img)}" alt="">` : icon("package")}</div>`;

function route() {
  clearTimeout(pollTimer);
  window.scrollTo(0, 0);
  const h = location.hash || "#orders";
  let m;
  if ((m = h.match(/^#new-(.+)$/))) return showNew(decodeURIComponent(m[1]));
  if ((m = h.match(/^#return-(\d+)$/))) return showReturn(+m[1]);
  if (h === "#returns") return showReturns();
  if (h === "#help") return showHelp();
  return showOrders();
}
window.addEventListener("hashchange", route);

/* ---------------- orders ---------------- */
async function showOrders() {
  setNav("orders"); document.title = "Your orders · ReturnGuard";
  orders = await api("/api/orders");
  $("view").innerHTML = `
    <div class="page-head"><div><h1>Your orders</h1><p>Returns are accepted within ${cfg.return_window_days} days of delivery.</p></div></div>
    <section class="card">${orders.length ? orders.map((o) => {
      const until = addDays(o.delivered_date, cfg.return_window_days);
      return `<article class="order">
        ${thumbHTML(o.image)}
        <div><h3>${esc(o.product)}</h3>
          <div class="meta"><span>Order <span class="mono">${esc(o.order_id)}</span></span>${o.colour ? `<span>Colour: ${esc(o.colour)}</span>` : ""}<span>Delivered ${fmtDate(o.delivered_date)}</span></div>
          <div class="window ${o.window_ok ? "ok" : "closed"}">${o.window_ok ? `Eligible for return until ${fmtDate(until)}` : `Return window closed on ${fmtDate(until)}`}</div></div>
        <div class="side"><span class="price">${rupees(o.price)}</span>
          ${o.return_id ? `${statusBadge(o.return_status)}<a class="btn secondary sm" href="#return-${o.return_id}">View return</a>`
                        : `<a class="btn ${o.window_ok ? "" : "secondary"} sm" href="#new-${encodeURIComponent(o.order_id)}">Return or report a problem</a>`}</div>
      </article>`;
    }).join("") : `<div class="empty">${icon("package")}<p>You have no orders yet.</p></div>`}</section>`;
}

/* ---------------- returns list ---------------- */
async function showReturns() {
  setNav("returns"); document.title = "Your returns · ReturnGuard";
  const cases = await api("/api/cases");
  if (!orders.length) orders = await api("/api/orders");
  $("view").innerHTML = `
    <div class="page-head"><div><h1>Your returns</h1><p>Requests you have made, newest first.</p></div></div>
    <section class="card">${cases.length ? `<div class="tablewrap"><table class="table">
      <thead><tr><th class="wide-only">Return</th><th>Item</th><th class="wide-only">Requested</th><th>Status</th><th class="wide-only"></th></tr></thead>
      <tbody>${cases.map((c) => `<tr data-id="${c.id}" tabindex="0">
        <td class="mono wide-only">${caseNo(c.id)}</td>
        <td><div class="item-cell">${thumbHTML(orderOf(c.order_id).image, "sm")}<span>${esc(c.product || c.order_id)}<small class="phone-only">${caseNo(c.id)} · ${fmtDate(c.created_at)}</small></span></div></td>
        <td class="wide-only">${fmtDate(c.created_at)}</td><td>${statusBadge(c.display_status || c.status)}</td><td class="wide-only" style="text-align:right;color:var(--ink-3)">${icon("chevron")}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">${icon("return")}<p>You haven't requested any returns.</p><p class="small" style="margin-top:6px"><a href="#orders">Go to your orders</a></p></div>`}</section>`;
  $("view").querySelectorAll("tbody tr").forEach((tr) => {
    const open = () => { location.hash = "#return-" + tr.dataset.id; };
    tr.onclick = open; tr.onkeydown = (e) => { if (e.key === "Enter") open(); };
  });
}

/* ---------------- new return ---------------- */
async function showNew(orderId) {
  setNav("orders"); document.title = "Return an item · ReturnGuard";
  if (!orders.length) orders = await api("/api/orders");
  const o = orderOf(orderId);
  if (!o.order_id) { $("view").innerHTML = `<div class="error">This order is not on your account.</div>`; return; }
  draft = [];
  const until = addDays(o.delivered_date, cfg.return_window_days);
  $("view").innerHTML = `
    <div><div class="crumbs"><a href="#orders">Orders</a>${icon("chevron")}<span>Return an item</span></div>
      <div class="page-head"><div><h1>Return an item</h1><p>Tell us what's wrong and add photos. Most requests are decided within a few minutes.</p></div></div></div>
    <div class="cols">
      <form class="card" id="form" novalidate>
        <section class="form-section"><h2><span class="n">1</span>Why are you returning this item?</h2>
          <div class="reasons" role="radiogroup" aria-label="Reason">${REASONS.map(([k, t, d]) => `
            <label class="reason"><input type="radio" name="reason" value="${k}"><div><b>${esc(t)}</b><span>${esc(d)}</span></div></label>`).join("")}</div></section>
        <section class="form-section"><h2><span class="n">2</span>Describe the problem</h2>
          <div class="field"><label for="details" class="label-text">Details <span class="faint" id="optional">(optional)</span></label>
            <textarea id="details" maxlength="900" placeholder="For example: there is a hole near the left cuff. It was like this when I opened the package."></textarea>
            <div class="counter" id="count">0 / 900</div></div></section>
        <section class="form-section"><h2><span class="n">3</span>Add photos</h2>
          <p class="hint" id="photohint">Add a photo of the whole item laid flat, and a close-up of any damage, in good light. Up to ${cfg.max_photos} photos.</p>
          <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add photos"><span class="ic">${icon("upload")}</span>
            <span><b>Click to upload</b> or drag and drop</span><span class="hint">JPG, PNG or WebP, up to 8 MB each</span></div>
          <div class="tiles" id="tiles"></div></section>
        ${o.window_ok ? "" : `<div style="padding:0 24px 20px"><div class="alert warn">${icon("alert")}<div>This order was delivered more than ${cfg.return_window_days} days ago, so the return will be declined automatically. You can ask for a second review afterwards.</div></div></div>`}
        <div id="err" role="alert" style="padding:0 24px"></div>
        <div class="form-foot"><a class="btn secondary" href="#orders">Cancel</a><button class="btn" id="submit" type="submit">Submit return request</button></div>
      </form>
      <aside class="stack">
        <section class="card summary"><div class="card-head"><h3>Item</h3></div><div class="card-body">
          <div class="item">${thumbHTML(o.image)}<div><b>${esc(o.product)}</b><div class="small muted">${o.colour ? esc(o.colour) + " · " : ""}${rupees(o.price)}</div></div></div>
          <dl class="kv"><dt>Order</dt><dd class="mono">${esc(o.order_id)}</dd><dt>Delivered</dt><dd>${fmtDate(o.delivered_date)}</dd>
            <dt>Return by</dt><dd>${fmtDate(until)}</dd></dl></div></section>
        <section class="card"><div class="card-head"><h3>What happens next</h3></div><div class="card-body">
          <ol class="steps-list"><li>We check that your photos are clear and show the item from this order.</li>
            <li>We inspect the photos for the problem you describe.</li>
            <li>You get a decision here, usually within minutes. Some requests are checked by our team.</li></ol></div></section>
      </aside>
    </div>`;
  $("details").oninput = () => { $("count").textContent = `${$("details").value.length} / 900`; };
  document.querySelectorAll("input[name=reason]").forEach((r) => r.onchange = () => {
    const needs = REASONS.find((x) => x[0] === r.value)[3];
    $("optional").hidden = needs;
    $("photohint").textContent = needs ? `Add a photo of the whole item laid flat, and a close-up of the problem, in good light. Up to ${cfg.max_photos} photos.`
                                       : `Add a photo of the whole item laid flat, showing it is unworn. Up to ${cfg.max_photos} photos.`;
  });
  const drop = $("drop");
  drop.onclick = () => { pickerTarget = "new"; $("picker").click(); };
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drop.click(); } };
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addDraft([...e.dataTransfer.files]));
  $("form").addEventListener("submit", (e) => submitNew(e, o));
  renderTiles();
}

function renderTiles() {
  $("tiles").innerHTML = draft.map((d, i) => {
    const st = !d.check ? ["", `<span class="spin"></span>Checking…`] : d.check.ok ? ["ok", `${icon("check")}Looks good`]
             : ["bad", `${icon("alert")}${d.check.problems.map((p) => PROBLEM[p] || p).join(", ")}. Please retake`];
    return `<div class="tile ${st[0]}"><div class="im"><img src="${d.url}" alt="Photo ${i + 1}">
      <button type="button" class="rm" data-i="${i}" aria-label="Remove photo ${i + 1}">${icon("x")}</button></div><span class="st ${st[0]}">${st[1]}</span></div>`;
  }).join("");
  $("tiles").querySelectorAll(".rm").forEach((b) => b.onclick = () => { draft.splice(+b.dataset.i, 1); renderTiles(); });
  $("drop").hidden = draft.length >= cfg.max_photos;
}

function addDraft(files) {
  for (const f of files.slice(0, cfg.max_photos - draft.length)) {
    const d = {file: f, url: URL.createObjectURL(f), check: null};
    draft.push(d); renderTiles();
    const fd = new FormData(); fd.append("image", f);
    api("/api/precheck", {method: "POST", body: fd}).then((q) => { d.check = q; renderTiles(); })
      .catch((err) => { d.check = {ok: false, problems: [err.message]}; renderTiles(); });
  }
}

$("picker").addEventListener("change", async (e) => {
  const files = [...e.target.files]; e.target.value = "";
  if (pickerTarget === "new") addDraft(files);
  else if (pickerTarget) await sendEvidence(pickerTarget, files.slice(0, cfg.max_photos));
});

async function submitNew(e, o) {
  e.preventDefault();
  $("err").innerHTML = "";
  const sel = document.querySelector("input[name=reason]:checked"), details = $("details").value.trim();
  const r = sel && REASONS.find((x) => x[0] === sel.value);
  if (!r) return $("err").innerHTML = `<div class="error">Choose why you are returning the item.</div>`;
  if (r[3] && !details) return $("err").innerHTML = `<div class="error">Describe the problem so we can check it.</div>`;
  if (!draft.length) return $("err").innerHTML = `<div class="error">Add at least one photo of the item.</div>`;
  const fd = new FormData();
  fd.append("order_id", o.order_id); fd.append("reason", details ? `${r[1]}. ${details}` : r[1]);
  draft.forEach((d) => fd.append("images", d.file));
  $("submit").disabled = true; $("submit").innerHTML = `<span class="spin"></span>Submitting…`;
  try {
    const c = await api("/api/cases", {method: "POST", body: fd});
    orders = [];
    location.hash = "#return-" + c.id;
  } catch (err) {
    $("err").innerHTML = `<div class="error" style="margin-bottom:16px">${esc(err.message)}</div>`;
    $("submit").disabled = false; $("submit").textContent = "Submit return request";
  }
}

/* ---------------- return detail ---------------- */
function outcomeHTML(c) {
  const resolution = c.resolution === "store_credit" ? "store credit" : "a full refund or a free replacement";
  if (c.status === "Checking") {
    const done = c.steps.filter((s, i, a) => i >= a.map((x) => x.step).lastIndexOf("get_order"));
    return `<div class="outcome info"><span class="ic"><span class="spin"></span></span><div><h2>We're checking your request</h2>
      <p>This usually takes less than a minute. You can leave this page; the result will be saved here.</p>
      <ul class="progress">${done.map((s) => `<li class="done">${icon("check")}${esc(STEP_LABEL[s.step] || s.step)}</li>`).join("")}
        <li><span class="spin"></span>In progress</li></ul></div></div>`;
  }
  if (c.status === "Approved" && c.pickup) return pickupHTML(c);
  if (c.status === "Approved") return `<div class="outcome ok"><span class="ic">${icon("check")}</span><div><h2>Your return is approved</h2>
      <p>You will receive ${resolution}.${c.decided_by === "reviewer" ? " Our returns team approved this request." : ""}</p>
      <p class="small faint" style="margin-top:10px">Reference <span class="mono">${esc(c.ticket_id || caseNo(c.id))}</span></p></div></div>`;
  if (c.status === "Photos needed") {
    const n = Math.min(c.evidence_rounds + 1, c.max_evidence_rounds);
    return `<div class="outcome warn"><span class="ic">${icon("camera")}</span><div><h2>We need another photo</h2>
      <p>${esc(c.request || c.message || "Please send another photo of the item.")}</p>
      <div class="actions"><button class="btn" type="button" id="upload">${icon("upload")}Upload photo</button></div>
      <p class="small faint" style="margin-top:10px">Request ${n} of ${c.max_evidence_rounds}${c.decided_by === "reviewer" ? " · from our returns team" : ""}</p>
      <div id="err" role="alert" style="margin-top:10px"></div></div></div>`;
  }
  if (c.status === "With reviewer") return `<div class="outcome info"><span class="ic">${icon("clock")}</span><div><h2>Our team is reviewing your request</h2>
      <p>${esc(c.message || "We'll update this page when there is a decision.")}</p></div></div>`;
  if (c.status === "Rejected") return `<div class="outcome bad"><span class="ic">${icon("info")}</span><div><h2>This return wasn't approved</h2>
      <p>${esc(c.message || "")}</p>${c.review_note ? `<p class="small" style="margin-top:8px">Note from our team: ${esc(c.review_note)}</p>` : ""}
      <div class="actions"><button class="btn secondary" type="button" id="appeal">${icon("refresh")}Ask for a second review</button></div>
      <div id="err" role="alert" style="margin-top:10px"></div></div></div>`;
  return "";
}

function pickupHTML(c) {
  const p = c.pickup, credit = c.resolution === "store_credit", amount = orderOf(c.order_id).price;
  const ref = `<p class="small faint" style="margin-top:10px">Reference <span class="mono">${esc(c.ticket_id || caseNo(c.id))}</span></p>`;
  if (p.status === "picked_up") return `<div class="outcome ok"><span class="ic">${icon("check")}</span><div>
      <h2>${credit ? "Store credit issued" : "Refund issued"}</h2><p>${esc(c.message || "")}</p>
      <dl class="kv refund"><dt>Amount</dt><dd>${rupees(p.refund_amount)}</dd><dt>Paid to</dt><dd>${credit ? "Your store credit" : "Original payment method"}</dd>
        <dt>Collected</dt><dd>${fmtDateTime(p.verified_at)}</dd></dl>${ref}</div></div>`;
  return `<div class="outcome ok"><span class="ic">${icon("truck")}</span><div>
      <h2>Your return is approved</h2>
      <p>${p.attempts > 1 ? "We missed you on our last visit. " : ""}A pickup partner will collect the item on <b>${fmtDate(p.scheduled_for)}, ${esc(p.slot)}</b>. Please keep it ready, ideally in its original packaging.</p>
      <div class="pickup-code"><div><span class="section-label">Pickup code</span><span class="code mono">${esc(p.code)}</span></div>
        <p class="small muted">Give this code to the pickup partner only after they have checked the item.</p></div>
      <p class="small muted" style="margin-top:12px">Your ${credit ? "store credit" : "refund"} of ${rupees(amount)} is issued as soon as the partner confirms the item at your door.${c.decided_by === "reviewer" ? " Our returns team approved this request." : ""}</p>${ref}</div></div>`;
}

function timelineHTML(c) {
  const decided = ["Approved", "Rejected"].includes(c.status), waiting = c.status === "Photos needed";
  const items = [
    ["done", "Request submitted", fmtDateTime(c.created_at)],
    [c.status === "Checking" ? "now" : "done", "Photos checked", c.status === "Checking" ? "In progress" : ""],
    [waiting || c.status === "With reviewer" ? "now" : (decided ? "done" : ""), waiting ? "Waiting for your photo" : "Review",
     c.status === "With reviewer" ? "With our returns team" : ""],
    [decided ? "done" : "", decided ? (c.status === "Approved" ? "Approved" : "Not approved") : "Decision", decided ? fmtDateTime(c.updated_at) : ""],
  ];
  const p = c.pickup;
  if (c.status === "Approved" && p) {  // R9: collected and checked at the door, then the refund
    const done = p.status === "picked_up";
    items.push([done ? "done" : "now", "Pickup", done ? "" : `${fmtDate(p.scheduled_for)}, ${p.slot}`],
               [done ? "done" : "", "Checked at your door and collected", done ? fmtDateTime(p.verified_at) : ""],
               [done ? "done" : "", c.resolution === "store_credit" ? "Store credit issued" : "Refund issued", done ? fmtDateTime(p.refunded_at) : ""]);
  }
  return `<ol class="timeline">${items.map(([s, t, d]) => `<li class="${s}"><span class="dot">${s === "done" ? icon("check") : ""}</span><div><b>${esc(t)}</b>${d ? `<span>${esc(d)}</span>` : ""}</div></li>`).join("")}</ol>`;
}

async function showReturn(id) {
  setNav("returns");
  let c;
  try { c = await api(`/api/cases/${id}`); } catch (err) { $("view").innerHTML = `<div class="error">${esc(err.message)}</div>`; return; }
  if (!orders.length) orders = await api("/api/orders");
  document.title = `Return ${caseNo(c.id)} · ReturnGuard`;
  const o = orderOf(c.order_id), MARK = {ok: "check", warn: "alert", bad: "x"};
  $("view").innerHTML = `
    <div><div class="crumbs"><a href="#returns">Returns</a>${icon("chevron")}<span class="mono">${caseNo(c.id)}</span></div>
      <div class="page-head"><div><h1>Return <span class="mono">${caseNo(c.id)}</span></h1><p>Requested ${fmtDateTime(c.created_at)}</p></div>${statusBadge(c.display_status || c.status)}</div></div>
    <div class="cols">
      <div class="stack">
        <section class="card">${outcomeHTML(c)}</section>
        ${c.status !== "Checking" && c.checks.length ? `<section class="card"><div class="card-head"><h3>What we checked</h3></div><div class="card-body">
          <ul class="checks">${c.checks.map((k) => `<li class="${k.ok ? "ok" : "warn"}">${icon(k.ok ? "check" : "alert")}<span>${esc(k.text)}</span></li>`).join("")}</ul></div></section>` : ""}
        <section class="card"><div class="card-head"><h3>Your photos</h3><span class="small faint">${c.photos.length} uploaded</span></div><div class="card-body">
          <div class="tiles">${c.photos.map((p, i) => { const s = p.status || {state: "", text: ""};
            return `<div class="tile ${s.state}"><div class="im"><img src="${esc(p.url)}" alt="Your photo ${i + 1}"></div>
              ${s.state ? `<span class="st ${s.state}">${icon(MARK[s.state])}${esc(s.text)}</span>` : ""}</div>`; }).join("")}</div></div></section>
      </div>
      <aside class="stack">
        <section class="card summary"><div class="card-head"><h3>Item</h3></div><div class="card-body">
          <div class="item">${thumbHTML(o.image)}<div><b>${esc(c.product || c.order_id)}</b><div class="small muted">${o.colour ? esc(o.colour) + " · " : ""}${o.price ? rupees(o.price) : ""}</div></div></div>
          <dl class="kv"><dt>Order</dt><dd class="mono">${esc(c.order_id)}</dd><dt>Return</dt><dd class="mono">${caseNo(c.id)}</dd></dl>
          <div><div class="section-label" style="margin-bottom:6px">Your description</div><p class="small muted">${esc(c.reason)}</p></div></div></section>
        <section class="card"><div class="card-head"><h3>Progress</h3></div><div class="card-body">${timelineHTML(c)}</div></section>
      </aside>
    </div>`;
  if ($("upload")) $("upload").onclick = () => { pickerTarget = id; $("picker").click(); };
  if ($("appeal")) $("appeal").onclick = async () => {
    try { await postJSON(`/api/cases/${id}/appeal`, {note: ""}); showReturn(id); }
    catch (err) { $("err").innerHTML = `<div class="error">${esc(err.message)}</div>`; }
  };
  if (c.status === "Checking") pollTimer = setTimeout(() => showReturn(id), 1500);
  else if (c.status === "With reviewer") pollTimer = setTimeout(() => showReturn(id), 10000);
  else if (c.pickup && c.pickup.status === "scheduled") pollTimer = setTimeout(() => showReturn(id), 8000);
}

async function sendEvidence(id, files) {
  if (!files.length) return;
  const fd = new FormData(); files.forEach((f) => fd.append("images", f));
  try { await api(`/api/cases/${id}/evidence`, {method: "POST", body: fd}); showReturn(id); }
  catch (err) { if ($("err")) $("err").innerHTML = `<div class="error">${esc(err.message)}</div>`; }
}

/* ---------------- help ---------------- */
function showHelp() {
  setNav("help"); document.title = "Help · ReturnGuard";
  const faq = [
    ["How long does a decision take?", "Most requests are decided within a few minutes of submitting them. Some are checked by our returns team, which usually takes up to one working day. You can follow the progress on the return's page."],
    ["What photos should I take?", "One photo of the whole item laid flat in good light, and a close-up of any damage. Avoid screenshots, filters and very dark photos. If a photo is unclear we'll tell you before you submit."],
    ["Why was I asked for another photo?", "Either the photo wasn't clear enough, the problem you described wasn't visible, or the photo didn't seem to show the item from your order. The request explains which, and you can send up to two more photos."],
    ["How does the pickup work?", "Once your return is approved, a pickup partner collects the item, usually the next day. At your door they check that it's the item from your order and that it matches what you reported (or that it's unworn with its tags), then ask for the pickup code shown on your return page. Your refund or store credit is issued as soon as they confirm. If you're not at home, they'll come again the next day."],
    ["How are refunds paid?", `Damaged or faulty items get a full refund or a free replacement. Items returned because they don't fit or you changed your mind get store credit. Returns are accepted within ${cfg.return_window_days} days of delivery.`],
    ["My return wasn't approved. What can I do?", "Open the return and choose “Ask for a second review”. A different member of our team will look at it."],
  ];
  $("view").innerHTML = `
    <div class="page-head"><div><h1>Help</h1><p>Answers to common questions about returns.</p></div><a class="btn secondary" href="/policy">${icon("file")}Read the return policy</a></div>
    <section class="card">${faq.map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</section>`;
}

/* ---------------- account menu ---------------- */
function accountMenu() {
  $("acct").innerHTML = `<span class="avatar">${esc(initials(me.name))}</span><span class="nm">${esc(me.name)}</span>${icon("down")}`;
  $("menu").innerHTML = `<div class="who"><b>${esc(me.name)}</b><div class="xs faint">${esc(me.username)}</div></div>
    <button type="button" id="signout">${icon("logout")}Sign out</button>`;
  $("acct").onclick = (e) => { e.stopPropagation(); const open = $("menu").hidden; $("menu").hidden = !open; $("acct").setAttribute("aria-expanded", open); };
  document.addEventListener("click", () => { $("menu").hidden = true; $("acct").setAttribute("aria-expanded", "false"); });
  $("signout").onclick = logout;
}

(async () => {
  me = await api("/api/me");
  if (me.role !== "customer") { location.href = ROLE_HOME[me.role] || "/login"; return; }
  cfg = await api("/api/config");
  accountMenu();
  route();
})();
</script>
