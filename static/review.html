<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returns console · ReturnGuard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=4">
<style>
body { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
@media (max-width: 960px) { body { grid-template-columns: 1fr; } .side { position: static !important; height: auto !important; } }
/* sidebar */
.side { background: #101828; color: #d0d5dd; display: flex; flex-direction: column; padding: 20px 14px; gap: 24px; position: sticky; top: 0; height: 100vh; }
.side .logo { padding: 0 8px; }
.side .grp { display: grid; gap: 2px; }
.side .grp-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #667085; padding: 0 10px 6px; }
.side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #d0d5dd; font-weight: 500; }
.side a:hover { background: #1d2939; text-decoration: none; color: #fff; }
.side a[aria-current="page"] { background: #1d2939; color: #fff; }
.side a .count { margin-left: auto; font-size: 12px; background: #344054; color: #fff; border-radius: 10px; padding: 0 7px; line-height: 18px; }
.side .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid #1d2939; }
.side .me .avatar { width: 32px; height: 32px; border-radius: 50%; background: #344054; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.side .me b { color: #fff; font-weight: 500; display: block; font-size: 13px; }
.side .me button { margin-left: auto; background: none; border: 0; color: #98a2b3; cursor: pointer; padding: 6px; border-radius: 6px; }
.side .me button:hover { background: #1d2939; color: #fff; }
/* main */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 64px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 28px; position: sticky; top: 0; z-index: 10; }
.topbar h1 { font-size: 18px; }
.search { margin-left: auto; position: relative; width: 300px; max-width: 45vw; }
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; color: var(--ink-3); }
.search input { padding-left: 34px; height: 38px; }
.content { padding: 24px 28px 48px; display: grid; gap: 20px; align-content: start; }
@media (max-width: 700px) { .content { padding: 16px; } .topbar { padding: 0 16px; } }
/* stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 16px 20px; display: grid; gap: 4px; }
.stat .l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.stat .n { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
/* table */
.tablewrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 11px 16px; background: var(--subtle); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { cursor: pointer; } .table tbody tr:hover td { background: var(--subtle); }
.item-cell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.thumb { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--subtle); object-fit: cover; flex: none; display: inline-block; }
.case-cell b { display: block; font-family: var(--mono); font-size: 13px; font-weight: 500; }
.case-cell span { font-size: 12px; color: var(--ink-3); }
/* case page */
.case-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.case-head h2 { font-size: 20px; font-family: var(--mono); font-weight: 600; }
.case-head .sub { width: 100%; color: var(--ink-2); font-size: 13px; }
.backlink { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); width: max-content; }
.backlink svg { width: 16px; height: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 20px; }
.viewer-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 13px; }
.viewer-bar .grow { flex: 1; }
.stage { background: #f2f4f7; display: flex; justify-content: center; padding: 16px; min-height: 260px; align-items: center; }
.stage .photo img { max-height: 520px; width: auto; max-width: 100%; border-radius: 4px; }
.thumbs { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.tb { position: relative; width: 64px; height: 64px; border-radius: 6px; border: 2px solid transparent; padding: 0; background: none; cursor: pointer; }
.tb img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }
.tb[aria-current="true"] { border-color: var(--brand); }
.tb .q { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.tb .q.bad { background: var(--bad); } .tb .q.warn { background: #f79009; }
.tabbar { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tabbar button { border: 0; background: none; padding: 12px 10px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabbar button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.findings { list-style: none; margin: 0; padding: 0; display: grid; }
.findings li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.findings li:last-child { border-bottom: 0; }
.findings .sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.findings .ok svg { color: var(--ok); } .findings .warn svg { color: var(--warn); } .findings .bad svg { color: var(--bad); } .findings .info svg { color: var(--ink-3); }
.calls { width: 100%; border-collapse: collapse; font-size: 13px; }
.calls td, .calls th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.calls th { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.calls pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow: auto; font: 11px/1.45 var(--mono); background: var(--subtle); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.calls details summary { cursor: pointer; color: var(--ink-2); }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13px; }
.events li { display: grid; grid-template-columns: 130px 1fr; gap: 12px; }
.events time { color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; text-align: right; }
.cat { display: flex; gap: 8px; flex-wrap: wrap; }
.cat a { width: 64px; height: 64px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: block; }
.cat img { width: 100%; height: 100%; object-fit: cover; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.quote { color: var(--ink-2); font-size: 13px; border-left: 2px solid var(--line-strong); padding-left: 10px; margin-top: 10px; }
.decision .btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.decision .btns .btn { padding: 0 8px; }
.decision .btns .btn[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--brand); }
.decision form { display: grid; gap: 14px; margin-top: 16px; }
details.clause { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
details.clause:last-child { border-bottom: 0; }
details.clause summary { cursor: pointer; font-weight: 500; }
details.clause p { color: var(--ink-2); margin-top: 6px; }
/* doorstep pickup card */
.pchecks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.pchecks li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; }
.pchecks li svg { width: 16px; height: 16px; margin-top: 1px; }
.pchecks li.ok svg { color: var(--ok); } .pchecks li.bad svg { color: var(--bad); }
.pphoto { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
</style>
</head>
<body>
<aside class="side" aria-label="Console navigation">
  <span id="logo"></span>
  <div class="grp"><div class="grp-label">Returns</div>
    <a href="#queue" data-f="escalated" id="nav-escalated"></a>
    <a href="#queue" data-f="photos" id="nav-photos"></a>
    <a href="#queue" data-f="flagged" id="nav-flagged"></a>
    <a href="#queue" data-f="decided" id="nav-decided"></a>
    <a href="#queue" data-f="all" id="nav-all"></a>
  </div>
  <div class="me" id="me"></div>
</aside>
<div class="main">
  <header class="topbar"><h1 id="title">Needs review</h1>
    <div class="search" id="searchbox"><input type="search" id="search" placeholder="Search returns, orders, customers" aria-label="Search returns"></div></header>
  <div class="content" id="page"></div>
</div>
<script src="/static/app.js?v=4"></script>
<script>
let me = null, filter = "escalated", rows = [], counts = {}, pollTimer = null, current = null, photoIdx = 0, showBoxes = true, action = null, tab = "findings";
const NAV = {escalated: ["inbox", "Needs review"], photos: ["camera", "Waiting on customer"], flagged: ["flag", "Integrity flags"],
             decided: ["archive", "Decided"], all: ["list", "All returns"]};
const REV_STATUS = {"Checking": ["info", "Processing"], "Approved": ["ok", "Approved"], "Photos needed": ["warn", "Waiting on customer"],
                    "With reviewer": ["bad", "Needs review"], "Rejected": ["mute", "Rejected"],
                    "Pickup scheduled": ["info", "Pickup scheduled"], "Refunded": ["ok", "Refunded"], "Credit issued": ["ok", "Credit issued"]};
const revStatus = (s) => { const [c, l] = REV_STATUS[s] || ["mute", s]; return `<span class="badge ${c}">${esc(l)}</span>`; };
const PRIORITY = {High: "bad", Medium: "warn", Low: "mute"};
const TOOL_NAME = {lookup_order: "Order lookup (T0)", parse_claim: "Claim parsing", assess_photos: "Photo quality and integrity (T1, T7)",
  verify_product: "Product check (T3)", detect_defects: "Defect detection (T4)", verify_with_vlm: "Vision-language check (T9)",
  retrieve_policy: "Policy retrieval (T8)", create_ticket: "Ticket (T10)"};

$("logo").innerHTML = logoHTML(true, "/admin");
$("searchbox").insertAdjacentHTML("afterbegin", icon("search"));
for (const [k, [ic, l]] of Object.entries(NAV)) $("nav-" + k).innerHTML = `${icon(ic)}<span>${l}</span><span class="count" id="c-${k}" hidden></span>`;
document.querySelectorAll(".side [data-f]").forEach((a) => a.onclick = (e) => { e.preventDefault(); filter = a.dataset.f; current = null;
  if (location.hash !== "#queue") location.hash = "#queue"; else route(); });
$("search").oninput = () => { if (!location.hash.startsWith("#case-")) renderTable(); };

function setNav() {
  document.querySelectorAll(".side [data-f]").forEach((a) => a.setAttribute("aria-current", !location.hash.startsWith("#case-") && a.dataset.f === filter ? "page" : "false"));
}
function route() {
  clearTimeout(pollTimer);
  const m = (location.hash || "").match(/^#case-(\d+)$/);
  setNav();
  return m ? showCase(+m[1]) : showQueue();
}
window.addEventListener("hashchange", route);

/* ---------------- queue ---------------- */
async function loadQueue() {
  const q = await api(`/api/review/queue?filter=${filter}`);
  rows = q.cases; counts = q.counts;
  for (const k of ["escalated", "photos", "flagged"]) { const el = $("c-" + k); el.hidden = !counts[k]; el.textContent = counts[k]; }
}
async function showQueue() {
  $("title").textContent = NAV[filter][1]; $("searchbox").hidden = false;
  document.title = `${NAV[filter][1]} · ReturnGuard`;
  await loadQueue();
  $("page").innerHTML = `
    <div class="stats">
      <div class="card stat"><span class="l">Needs review</span><span class="n">${counts.escalated}</span></div>
      <div class="card stat"><span class="l">Waiting on customer</span><span class="n">${counts.photos}</span></div>
      <div class="card stat"><span class="l">Integrity flags</span><span class="n">${counts.flagged}</span></div>
      <div class="card stat"><span class="l">Decided</span><span class="n">${counts.decided}</span></div>
    </div>
    <section class="card"><div class="tablewrap" id="tablewrap"></div></section>`;
  renderTable();
  pollTimer = setTimeout(showQueue, 15000);
}
function renderTable() {
  const term = $("search").value.trim().toLowerCase();
  const list = rows.filter((c) => !term || [caseNo(c.id), c.order_id, c.customer, c.product, c.reason].join(" ").toLowerCase().includes(term));
  $("tablewrap").innerHTML = list.length ? `<table class="table">
    <thead><tr><th>Return</th><th>Item</th><th>Reason</th><th>Recommendation</th><th>Priority</th><th>Status</th><th>Updated</th></tr></thead>
    <tbody>${list.map((c) => {
      const [dc, dl] = DECISION_BADGE[c.decision] || ["info", "Pending"];
      return `<tr data-id="${c.id}" tabindex="0">
        <td class="case-cell"><b>${caseNo(c.id)}</b><span>${esc(c.customer || "")}</span></td>
        <td><div class="item-cell">${c.thumb ? `<img class="thumb" src="${esc(c.thumb)}" alt="">` : `<span class="thumb"></span>`}<span>${esc(c.product || c.order_id)}</span></div></td>
        <td>${esc(c.reason)}${c.flagged ? ` <span class="badge bad">Flag</span>` : ""}</td>
        <td><span class="badge ${dc}">${esc(dl)}</span></td>
        <td><span class="badge ${PRIORITY[c.priority]}">${esc(c.priority)}</span></td>
        <td>${revStatus(c.display_status || c.status)}</td>
        <td class="small faint" style="white-space:nowrap">${fmtDateTime(c.updated_at)}</td></tr>`;
    }).join("")}</tbody></table>`
    : `<div class="empty">${icon("inbox")}<p>${term ? "No returns match your search." : "Nothing here right now."}</p></div>`;
  $("tablewrap").querySelectorAll("tbody tr").forEach((tr) => {
    const open = () => { location.hash = "#case-" + tr.dataset.id; };
    tr.onclick = open; tr.onkeydown = (e) => { if (e.key === "Enter") open(); };
  });
}

/* ---------------- case ---------------- */
function regionsFor(c, photo) {
  if (c.vision && c.vision.media_id === photo.id) return c.vision.regions || [];
  const p = ((c.decision_detail || {}).per_photo || []).find((x) => x.media_id === photo.id);
  return p ? p.regions || [] : [];
}

function findings(c) {
  const out = [], v = c.vision, vc = c.vlm, pre = c.preanalysis, pc = (c.decision_detail || {}).product_check;
  const idx = (id) => c.photos.findIndex((p) => p.id === id) + 1;
  const add = (cls, ic, text, sub = "") => out.push(`<li class="${cls}">${icon(ic)}<div>${text}${sub ? `<div class="sub">${sub}</div>` : ""}</div></li>`);
  if (pre) {
    const bad = pre.photos.map((p, i) => [p, i]).filter(([p]) => !p.ok);
    if (bad.length) add("warn", "alert", `${bad.length} of ${pre.total} photos failed the quality check`, bad.map(([p, i]) => `Photo ${i + 1}: ${esc(p.problems.join(", ").replace(/_/g, " "))}`).join(" · "));
    else add("ok", "check", pre.total === 1 ? "The photo passed the quality check" : `All ${pre.total} photos passed the quality check`);
    for (const f of pre.integrity_flags || []) add("bad", "flag", "Integrity flag", esc(f));
  }
  if (pc) {
    const t = {match: ["ok", "check", "Photos show the ordered item"], mismatch: ["bad", "x", "Photos do not look like the ordered item"],
               unverified: ["info", "info", "Item could not be identified from the photos"], not_run: ["info", "info", "Product check did not run"]}[pc.status];
    const noGemini = (pc.errors || []).length && !(pc.sources || []).includes("gemini");
    if (t) add(noGemini && pc.status !== "match" ? "warn" : t[0], noGemini && pc.status !== "match" ? "alert" : t[1],
      noGemini && pc.status !== "match" ? "Wrong-item check incomplete: Gemini did not answer, so check the item yourself" : t[2],
      (pc.per_photo || []).map((p) => `Photo ${idx(p.media_id)}: ${esc(p.visible || "—")}${p.catalog_sim != null ? ` · catalog similarity ${p.catalog_sim}` : ""}${p.seen ? ` · “${esc(p.seen)}”` : ""}`).join("<br>")
      + (noGemini ? `<br>${esc(pc.errors[0])}` : ""));
  }
  if (v) {
    if (v.verdict === "damaged" || v.verdict === "unsure")
      add(v.verdict === "damaged" ? "warn" : "info", "zoom", `Detector: ${esc(v.defect_type || "damage")} on photo ${idx(v.media_id)} (score ${Number(v.damage_score ?? v.confidence).toFixed(2)})${v.verdict === "unsure" ? ", weak" : ""}`,
          v.mode === "tiles" ? "Found on a zoomed-in pass" : "");
    else if (v.verdict === "clean") add("ok", "check", "Detector found no damage");
    else if (v.verdict === "no_garment") add("warn", "alert", "No garment found in the photos");
  }
  if (vc) {
    const obs = (vc.observations || []).map((o) => `“${esc(o.description)}”`).join("<br>");
    if (vc.status === "damage_seen") add(vc.matches_claim === false ? "warn" : "ok", "eye", `Vision-language check sees ${esc((vc.types_seen || []).join(", "))}${vc.matches_claim === false ? ", not what was claimed" : ""}`, obs);
    else if (vc.status === "no_damage_seen") add("warn", "eye", "Vision-language check sees no damage", obs);
    else if (vc.status === "failed") add("info", "info", "Vision-language check failed", esc((vc.errors || [])[0] || ""));
  } else if (v && (v.verdict === "damaged" || v.verdict === "unsure")) add("info", "info", "Vision-language check did not run");
  return out.join("") || `<li class="info">${icon("info")}<div>No findings yet.</div></li>`;
}

function tabHTML(c) {
  const d = c.decision_detail || {};
  if (tab === "activity") return `<div class="card-body" style="padding-top:8px"><table class="calls"><thead><tr><th>Step</th><th>Tool</th><th style="text-align:right">Time</th></tr></thead><tbody>
    ${c.tool_calls.map((t) => `<tr><td class="mono">${t.run_no}.${t.step_no}</td><td>${esc(TOOL_NAME[t.tool] || t.tool)}${t.error ? `<div class="small" style="color:var(--bad)">${esc(t.error)}</div>` : ""}
      <details><summary class="xs">Output</summary><pre>${esc(JSON.stringify(t.result, null, 1).slice(0, 2000))}</pre></details></td><td class="mono" style="text-align:right;white-space:nowrap">${t.latency_ms} ms</td></tr>`).join("")}
    </tbody></table>
    <p class="small faint" style="margin-top:12px">Outcome set by ${esc(d.source || "rules")}${d.agreement === false ? "; the language model's proposal differed from the rules" : ""}.</p>
    ${(d.notes || []).map((n) => `<p class="small faint">${esc(n)}</p>`).join("")}</div>`;
  if (tab === "history") return `<div class="card-body"><ul class="events">${c.events.map((e) => `<li><time>${esc(e.ts.replace("T", " ").slice(0, 16))}</time>
    <span>${esc(e.actor)} · ${esc(e.action.replace(/_/g, " "))}${e.detail && e.detail.reason_code ? ` (${esc(e.detail.reason_code)})` : ""}${e.detail && (e.detail.text || e.detail.date || e.detail.next_date) ? ` · ${esc(e.detail.text || e.detail.date || e.detail.next_date)}` : ""}${e.detail && e.detail.amount ? ` · ${rupees(e.detail.amount)} to ${esc(e.detail.method)}` : ""}${e.detail && e.detail.note ? ` · “${esc(e.detail.note)}”` : ""}</span></li>`).join("")}</ul></div>`;
  return `<div class="card-body" style="padding-top:4px"><ul class="findings">${findings(c)}</ul></div>`;
}

function pickupCard(c) {  // R9: what the pickup partner found at the door
  const p = c.pickup;
  if (!p) return "";
  const [bc, bl] = {scheduled: ["info", "Scheduled"], picked_up: ["ok", "Collected"], failed: ["bad", "Not collected"],
                    cancelled: ["mute", "Cancelled"]}[p.status] || ["mute", p.status];
  const credit = c.resolution === "store_credit";
  let kv = `<dt>Partner</dt><dd>${esc(p.courier || "Not assigned")}</dd>`;
  if (p.status === "scheduled") kv += `<dt>Visit</dt><dd>${fmtDate(p.scheduled_for)}, ${esc(p.slot)}</dd>${p.attempts > 1 ? `<dt>Attempt</dt><dd>${p.attempts}</dd>` : ""}`;
  if (p.status === "picked_up") kv += `<dt>Collected</dt><dd>${fmtDateTime(p.verified_at)}</dd><dt>${credit ? "Credit" : "Refund"}</dt><dd>${rupees(p.refund_amount)} issued</dd>`;
  if (p.status === "failed") kv += `<dt>Outcome</dt><dd style="color:var(--bad)">${esc(p.failure || "Not collected")}</dd>`;
  return `<section class="card"><div class="card-head"><h3>Doorstep pickup</h3><span class="badge ${bc}">${bl}</span></div>
    <div class="card-body" style="display:grid;gap:14px"><dl class="kv">${kv}</dl>
      ${p.checks.length ? `<ul class="pchecks">${p.checks.map((k) => `<li class="${k.ok ? "ok" : "bad"}">${icon(k.ok ? "check" : "x")}<span>${esc(k.text)}</span></li>`).join("")}</ul>` : ""}
      ${p.note ? `<p class="quote">${esc(p.note)}</p>` : ""}
      ${p.photo ? `<div><div class="section-label" style="margin-bottom:8px">Photo at pickup</div><a href="${esc(p.photo)}" target="_blank" rel="noopener"><img class="pphoto" src="${esc(p.photo)}" alt="Photo taken at pickup"></a></div>` : ""}
    </div></section>`;
}

async function showCase(id) {
  $("searchbox").hidden = true;
  let c;
  try { c = await api(`/api/cases/${id}`); } catch (err) { $("page").innerHTML = `<div class="error">${esc(err.message)}</div>`; return; }
  if (!current || current.id !== id) { photoIdx = Math.max(0, c.photos.findIndex((p) => c.vision && p.id === c.vision.media_id)); action = null; tab = "findings"; }
  current = c;
  $("title").textContent = "Return details"; document.title = `${caseNo(c.id)} · ReturnGuard`;
  const [dc, dl] = DECISION_BADGE[c.decision] || ["info", "Pending"];
  const o = c.order, claim = c.parsed_claim || {}, d = c.decision_detail || {};
  const photo = c.photos[photoIdx] || c.photos[0];
  const decided = ["Approved", "Rejected"].includes(c.status), last = c.reviews[c.reviews.length - 1];
  const alertCls = {ok: "ok", warn: "warn", bad: "warn", mute: "info", info: "info"}[dc];
  $("page").innerHTML = `
    <a class="backlink" href="#queue">${icon("back")}Back to ${esc(NAV[filter][1].toLowerCase())}</a>
    <div class="case-head"><h2>${caseNo(c.id)}</h2>${revStatus(c.display_status || c.status)}<span class="badge ${PRIORITY[c.priority]}">${esc(c.priority)} priority</span>
      <div class="sub">${esc(o ? o.customer : "")} · ${esc(o ? o.product : c.order_id)} · submitted ${fmtDateTime(c.created_at)}</div></div>
    <div class="grid2">
      <div class="stack">
        <section class="card">
          <div class="viewer-bar"><b>Photo ${photoIdx + 1} of ${c.photos.length}</b>
            ${photo && photo.round ? `<span class="badge warn">Added after request ${photo.round}</span>` : ""}
            ${photo && photo.status ? `<span class="badge ${photo.status.state === "ok" ? "ok" : photo.status.state === "bad" ? "bad" : "warn"}">${esc(photo.status.text)}</span>` : ""}
            <span class="grow"></span>
            <label class="small" style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" id="tboxes" ${showBoxes ? "checked" : ""}> Show detections</label>
            ${photo ? `<a class="btn secondary sm" href="${esc(photo.url)}" target="_blank" rel="noopener">${icon("zoom")}Full size</a>` : ""}</div>
          <div class="stage">${photo ? `<div class="photo${showBoxes ? "" : " nobox"}"><img src="${esc(photo.url)}" alt="Customer photo ${photoIdx + 1}">${boxesHTML(regionsFor(c, photo))}</div>` : `<div class="empty">No photos.</div>`}</div>
          ${c.photos.length > 1 ? `<div class="thumbs">${c.photos.map((p, i) => `<button class="tb" type="button" data-i="${i}" aria-current="${i === photoIdx}" aria-label="Photo ${i + 1}" title="${esc((p.status || {}).text || "")}">
            <img src="${esc(p.url)}" alt="">${p.status && p.status.state !== "ok" ? `<span class="q ${p.status.state}">${p.status.state === "bad" ? "✕" : "!"}</span>` : ""}</button>`).join("")}</div>` : ""}
        </section>
        <section class="card">
          <div class="tabbar" role="tablist">${[["findings", "Findings"], ["activity", "Agent activity"], ["history", "History"]].map(([k, l]) =>
            `<button role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>
          ${tabHTML(c)}
        </section>
      </div>
      <div class="stack decision">
        ${c.recommendation ? `<div class="alert ${alertCls}">${icon("info")}<div><b>Recommendation: ${esc(dl)}</b>${c.reason_label ? ` · ${esc(c.reason_label)}` : ""}<div style="margin-top:4px">${esc(c.recommendation)}</div></div></div>` : ""}
        <section class="card"><div class="card-head"><h3>Decision</h3>${decided ? `<span class="small faint">${esc(c.status)} ${c.decided_by === "agent" ? "automatically" : "by " + esc(c.decided_by || "")}</span>` : ""}</div><div class="card-body">
          ${decided && last ? `<p class="small muted" style="margin-bottom:12px">Reason: ${esc(last.reason_code)}${last.note ? ` · “${esc(last.note)}”` : ""}. You can change it below.</p>` : ""}
          <div class="btns" role="group" aria-label="Decision">
            <button class="btn ok" type="button" data-a="approve" aria-pressed="${action === "approve"}">Approve</button>
            <button class="btn danger" type="button" data-a="reject" aria-pressed="${action === "reject"}">Reject</button>
            <button class="btn secondary" type="button" data-a="request_info" aria-pressed="${action === "request_info"}">Ask for info</button></div>
          <form id="decideform" ${action ? "" : "hidden"} novalidate>
            <div class="field"><label for="reason">Reason</label><select id="reason"></select></div>
            <div class="field" id="msgwrap" hidden><label for="msg">Message to the customer</label><textarea id="msg" maxlength="500" placeholder="For example: please send a close-up of the left cuff in daylight." style="min-height:72px"></textarea></div>
            <div class="field"><label for="note">Internal note <span class="faint" style="font-weight:400">(optional)</span></label><textarea id="note" maxlength="1000" style="min-height:64px"></textarea></div>
            <div class="field"><label for="vf">Was the automated analysis right?</label><select id="vf">
              <option value="">Not sure</option><option value="correct">Yes</option>
              <option value="false_positive">No, it marked damage that isn't there</option><option value="missed_defect">No, it missed real damage</option></select></div>
            <button class="btn block" type="submit" id="confirm">Confirm decision</button><div id="err" role="alert"></div>
          </form></div></section>
        ${pickupCard(c)}
        <section class="card"><div class="card-head"><h3>Order</h3>${o ? `<span class="mono small faint">${esc(o.order_id)}</span>` : ""}</div><div class="card-body" style="display:grid;gap:14px">
          ${o ? `<dl class="kv"><dt>Customer</dt><dd>${esc(o.customer)}</dd><dt>Item</dt><dd>${esc(o.product)}</dd><dt>Colour</dt><dd>${esc(o.colour || "—")}</dd>
            <dt>Price</dt><dd>${rupees(o.price)}</dd><dt>Delivered</dt><dd>${fmtDate(o.delivered_date)} (${o.days_since_delivery} days ago)</dd>
            <dt>Return window</dt><dd>${o.window_ok ? "Open" : `<span style="color:var(--bad)">Closed</span>`}</dd></dl>
            ${(c.catalog_photos || []).length ? `<div><div class="section-label" style="margin-bottom:8px">Catalog photos</div><div class="cat">${c.catalog_photos.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Catalog photo"></a>`).join("")}</div></div>` : ""}`
            : `<p style="color:var(--bad)">Order not found.</p>`}</div></section>
        <section class="card"><div class="card-head"><h3>Customer's claim</h3></div><div class="card-body">
          <div class="chips"><span class="badge mute">${esc((claim.defect_type || "no damage described").replace(/_/g, " "))}</span>
            ${claim.location ? `<span class="badge mute">${esc(claim.location)}</span>` : ""}
            <span class="badge mute">${esc((claim.timing || "timing unknown").replace(/_/g, " "))}</span></div>
          <p class="quote">${esc(c.reason)}</p></div></section>
        <section class="card"><div class="card-head"><h3>Policy applied</h3></div><div class="card-body" style="padding-top:8px">
          ${(d.clauses || []).map((k) => `<details class="clause"><summary>${esc(k.id)} · ${esc(k.title)}</summary><p>${esc(k.text)}</p></details>`).join("") || `<p class="small faint">None cited.</p>`}</div></section>
      </div>
    </div>`;

  $("tboxes").onchange = (e) => { showBoxes = e.target.checked; showCase(id); };
  $("page").querySelectorAll(".tb").forEach((b) => b.onclick = () => { photoIdx = +b.dataset.i; showCase(id); });
  $("page").querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; showCase(id); });
  $("page").querySelectorAll("[data-a]").forEach((b) => b.onclick = () => { action = b.dataset.a; showCase(id); });
  if (action) {
    $("reason").innerHTML = `<option value="">Select a reason</option>` + Object.entries(c.review_reasons[action]).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
    $("msgwrap").hidden = action !== "request_info";
    $("decideform").onsubmit = (e) => { e.preventDefault(); submitReview(id); };
  }
  if (c.status === "Checking") pollTimer = setTimeout(() => showCase(id), 2000);
}

async function submitReview(id) {
  $("err").innerHTML = "";
  if (!$("reason").value) { $("err").innerHTML = `<div class="error">Choose a reason.</div>`; return; }
  $("confirm").disabled = true;
  try {
    await postJSON(`/api/cases/${id}/review`, {action, reason_code: $("reason").value, note: $("note").value,
      message: $("msg").value, vision_feedback: $("vf").value || null});
    action = null; showCase(id);
  } catch (err) { $("err").innerHTML = `<div class="error">${esc(err.message)}</div>`; $("confirm").disabled = false; }
}

(async () => {
  me = await api("/api/me");
  if (me.role !== "reviewer") { location.href = ROLE_HOME[me.role] || "/login"; return; }
  $("me").innerHTML = `<span class="avatar">${esc(initials(me.name))}</span><div><b>${esc(me.name)}</b><span class="xs">${esc(me.username)}</span></div>
    <button type="button" aria-label="Sign out" title="Sign out" onclick="logout()">${icon("logout")}</button>`;
  route();
})();
</script>
</body>
</html>
