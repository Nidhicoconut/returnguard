<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ReturnGuard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=4">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
.wrap { width: 100%; max-width: 400px; display: grid; gap: 28px; }
.head { display: grid; justify-items: center; gap: 20px; text-align: center; }
.head h1 { font-size: 24px; }
.head p { color: var(--ink-2); margin-top: 6px; }
.card { padding: 28px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.pw { position: relative; }
.pw input { padding-right: 44px; }
.eye { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; }
.eye:hover { background: var(--subtle); color: var(--ink); }
.note { text-align: center; font-size: 13px; color: var(--ink-3); }
.card.demo { padding: 14px 16px; gap: 8px; overflow: visible; position: relative; z-index: 5; }
.demo-label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.demo-row { display: flex; gap: 8px; }
.reset { width: 48px; height: 48px; flex: none; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
.reset:hover { background: var(--subtle); color: var(--ink); }
.reset svg { width: 16px; height: 16px; }
/* account picker: a button that opens a listbox */
.picker { position: relative; flex: 1; min-width: 0; }
.picker-btn { width: 100%; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; border: 1px solid var(--line-strong); border-radius: 8px;
              background: #fff; text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.picker-btn:hover { border-color: var(--ink-3); }
.picker-btn:focus-visible, .picker.open .picker-btn { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(29, 52, 97, .12); }
.picker-btn .ph { flex: 1; min-width: 0; color: var(--ink-3); padding-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker-btn .caret { margin-left: auto; color: var(--ink-3); transition: transform .15s; }
.picker.open .picker-btn .caret { transform: rotate(180deg); }
.av { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--brand-soft); color: var(--brand); }
.av.rev { background: var(--info-bg); color: var(--info); }
.av.courier { background: var(--warn-bg); color: var(--warn); }
.av.blank { background: var(--subtle); color: var(--ink-3); border: 1px dashed var(--line-strong); }
.av.blank svg { width: 15px; height: 15px; }
.who { min-width: 0; flex: 1; display: grid; line-height: 1.25; }
.who strong { font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
.menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg);
        padding: 6px; list-style: none; margin: 0; max-height: 440px; overflow-y: auto; display: none; }
.picker.open .menu { display: block; animation: drop .12s ease-out; }  /* display:none when closed, so it never adds scroll space */
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.menu:focus { outline: none; }
.picker.up .menu { top: auto; bottom: calc(100% + 6px); }
.picker.up.open .menu { animation-name: rise; }
.menu .grp { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.menu .grp + .opt { margin-top: 0; }
.opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.opt.active { background: var(--subtle); }
.opt[aria-selected="true"] { background: var(--brand-soft); }
.opt .tick { width: 16px; height: 16px; color: var(--brand); visibility: hidden; flex: none; }
.opt[aria-selected="true"] .tick { visibility: visible; }
.menu .sep { height: 1px; background: var(--line); margin: 6px 4px; }
@media (prefers-reduced-motion: reduce) { .picker.open .menu { animation: none; } .picker-btn .caret { transition: none; } }
.reset.busy svg { animation: spin .8s linear infinite; }
.demo-msg { font-size: 12px; color: var(--ok); }
@media (max-width: 480px) { .card { padding: 22px 18px; } main { padding: 32px 16px; } }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="head">
      <span id="logo"></span>
      <div><h1>Sign in to your account</h1><p>Track orders, request returns and follow their progress.</p></div>
    </div>
    <form class="card" id="form" novalidate>
      <div class="field"><label for="username">Username</label><input type="text" id="username" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw"><input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false"></button></div></div>
      <button class="btn block" id="submit" type="submit">Sign in</button>
      <div id="err" role="alert"></div>
    </form>
    <section class="card demo" id="demo" hidden aria-label="Test accounts"></section>
    <p class="note">Need help with an order? See our <a href="/policy">return policy</a>.</p>
  </div>
</main>
<script src="/static/app.js?v=4"></script>
<script>
document.body.insertAdjacentHTML("beforeend", footerHTML());
$("logo").innerHTML = logoHTML(false, "/login");
function setVisible(show) {
  $("password").type = show ? "text" : "password";
  $("eye").innerHTML = icon(show ? "eyeOff" : "eye");
  $("eye").setAttribute("aria-pressed", show);
  $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
}
setVisible(false);
$("eye").onclick = () => { setVisible($("password").type === "password"); $("password").focus(); };

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").innerHTML = "";
  if (!$("username").value.trim() || !$("password").value) {
    $("err").innerHTML = `<div class="error">Enter your username and password.</div>`;
    return;
  }
  $("submit").disabled = true;
  try {
    const u = await postJSON("/api/login", {username: $("username").value.trim(), password: $("password").value});
    location.href = ROLE_HOME[u.role] || "/account";
  } catch (err) {
    $("err").innerHTML = `<div class="error">${esc(err.message)}</div>`;
  } finally { $("submit").disabled = false; }
});

(async () => {  // demo account shortcuts only when SHOW_DEMO_ACCOUNTS=1 on the server
  try {
    const demo = (await api("/api/config")).demo_accounts || [];
    if (demo.length) {
      $("demo").hidden = false;
      const ROLE = {customer: ["", "mute", "Customer"], reviewer: ["rev", "info", "Reviewer"], courier: ["courier", "warn", "Pickup"]};
      const avatar = (a) => `<span class="av ${ROLE[a.role][0]}">${esc(initials(a.name))}</span>`;
      const roleBadge = (a) => `<span class="badge ${ROLE[a.role][1]}">${ROLE[a.role][2]}</span>`;
      const option = (a) => `<li class="opt" role="option" id="opt-${esc(a.username)}" data-u="${esc(a.username)}" aria-selected="false">
          ${avatar(a)}<span class="who"><strong>${esc(a.name)}</strong><span>${esc(a.username)} · ${esc(a.password)}</span></span>${icon("check", "tick")}</li>`;
      const group = (label, role) => `<li class="grp" role="presentation">${label}</li>` + demo.filter((a) => a.role === role).map(option).join("");
      $("demo").innerHTML = `<span class="demo-label" id="acct-label">Test account</span>
        <div class="demo-row">
          <div class="picker" id="picker">
            <button type="button" class="picker-btn" id="acct" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="acct-label acct"></button>
            <ul class="menu" id="acct-menu" role="listbox" tabindex="-1" aria-labelledby="acct-label">
              ${group("Customers", "customer")}<li class="sep" role="presentation"></li>${group("Reviewer", "reviewer")}<li class="sep" role="presentation"></li>${group("Pickup partner", "courier")}</ul>
          </div>
          <button type="button" class="reset" id="reset" title="Reset demo: delete all returns and photos" aria-label="Reset demo data">${icon("refresh")}</button>
        </div>
        <div class="demo-msg" id="demo-msg" hidden></div>`;

      const opts = [...$("acct-menu").querySelectorAll(".opt")];
      let chosen = null, active = -1;
      const showChosen = () => {
        $("acct").innerHTML = chosen
          ? `${avatar(chosen)}<span class="who"><strong>${esc(chosen.name)}</strong><span>${esc(chosen.username)}</span></span>${roleBadge(chosen)}${icon("down", "caret")}`
          : `<span class="av blank">${icon("user")}</span><span class="ph">Choose an account</span>${icon("down", "caret")}`;
      };
      const setActive = (i) => {
        active = (i + opts.length) % opts.length;
        opts.forEach((o, k) => o.classList.toggle("active", k === active));
        opts[active].scrollIntoView({block: "nearest"});
        $("acct-menu").setAttribute("aria-activedescendant", opts[active].id);
      };
      const open = (yes) => {
        if (yes) { const r = $("acct").getBoundingClientRect(); $("picker").classList.toggle("up", innerHeight - r.bottom < 450 && r.top > innerHeight - r.bottom); }
        $("picker").classList.toggle("open", yes);
        $("acct").setAttribute("aria-expanded", yes);
        if (yes) { setActive(Math.max(0, opts.findIndex((o) => o.dataset.u === chosen?.username))); $("acct-menu").focus(); }
      };
      const pick = (username) => {
        chosen = demo.find((a) => a.username === username);
        opts.forEach((o) => o.setAttribute("aria-selected", o.dataset.u === username));
        $("username").value = chosen.username; $("password").value = chosen.password; $("err").innerHTML = "";
        showChosen(); open(false); $("submit").focus();
      };
      showChosen();
      $("acct").onclick = () => open(!$("picker").classList.contains("open"));
      $("acct").onkeydown = (e) => { if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) { e.preventDefault(); open(true); } };
      opts.forEach((o, i) => { o.onclick = () => pick(o.dataset.u); o.onmousemove = () => { if (active !== i) setActive(i); }; });
      $("acct-menu").onkeydown = (e) => {
        if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
        else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(opts[active].dataset.u); }
        else if (e.key === "Escape" || e.key === "Tab") { open(false); $("acct").focus(); }
      };
      document.addEventListener("click", (e) => { if (!$("picker").contains(e.target)) open(false); });
      $("reset").onclick = async () => {
        if (!confirm("Reset the demo?\n\nThis deletes every return, its photos and its history, and starts case numbers from RG-000001 again. Accounts and orders are kept.")) return;
        $("reset").classList.add("busy"); $("reset").disabled = true;
        try {
          const r = await postJSON("/api/demo/reset", {});
          $("demo-msg").textContent = `Demo reset: ${r.cases} return${r.cases === 1 ? "" : "s"} and ${r.photos} photo${r.photos === 1 ? "" : "s"} removed.`;
          $("demo-msg").hidden = false;
        } catch (err) { $("err").innerHTML = `<div class="error">${esc(err.message)}</div>`; }
        finally { $("reset").classList.remove("busy"); $("reset").disabled = false; }
      };
    }
  } catch {}
  $("username").focus();
})();
</script>
</body>
</html>
