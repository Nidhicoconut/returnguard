<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ReturnGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
       background: radial-gradient(1200px 600px at 10% -10%, #2b4682 0%, transparent 60%),
                   radial-gradient(900px 500px at 110% 110%, #ff7a5926 0%, transparent 55%),
                   linear-gradient(160deg, var(--navy) 0%, #1b2f5c 100%); }
.wrap { width: 100%; max-width: 420px; display: grid; gap: 18px; }
.top { text-align: center; color: #fff; display: grid; gap: 10px; justify-items: center; }
.top .brand { font-size: 24px; }
.top .brand .tag { width: 40px; height: 40px; border-radius: 12px; }
.top .brand .tag svg { width: 22px; height: 22px; }
.top p { margin: 0; color: #c3cde4; font-size: 14px; max-width: 32ch; }
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg); padding: 26px 22px 20px; }
.card h1 { font-size: 20px; }
.card .sub { color: var(--ink-2); font-size: 14px; margin: 4px 0 18px; }
.roles { display: grid; gap: 10px; }
.role { display: grid; grid-template-columns: 46px 1fr 20px; gap: 14px; align-items: center; text-align: left; width: 100%;
        background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer;
        transition: border-color .15s, background .15s, transform .15s; }
.role:hover { border-color: var(--line-2); transform: translateY(-1px); background: #fff; }
.role[aria-expanded="true"] { border-color: var(--coral); background: #fff; box-shadow: 0 0 0 4px var(--coral-soft); }
.avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--navy-3), var(--navy)); }
.avatar.r { background: linear-gradient(135deg, #ff9a7e, var(--coral)); }
.avatar svg { width: 22px; height: 22px; }
.role b { display: block; font-size: 15px; }
.role span.s { font-size: 13px; color: var(--ink-2); }
.arrow { color: var(--ink-3); }
.role[aria-expanded="true"] .arrow { color: var(--coral); }
form { margin-top: 6px; }
.demo { margin-top: 14px; font-size: 13px; color: var(--ink-2); background: var(--card); border: 1px dashed var(--line-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.demo button { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--navy-2); }
.demo button:hover { border-color: var(--navy-3); }
.foot { text-align: center; color: #9fb0d3; font-size: 12px; }
.pw { position: relative; }
.pw input { padding-right: 46px; }
.eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 10px;
       background: transparent; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; }
.eye:hover { background: var(--card); color: var(--navy-2); }
.eye[aria-pressed="true"] { color: var(--coral); }
</style>
</head>
<body>
<div class="wrap rise">
  <div class="top" id="top"></div>
  <main class="card">
    <h1>Sign in to continue</h1>
    <p class="sub">Choose how you want to use ReturnGuard.</p>
    <div class="roles">
      <button class="role" id="role-customer" type="button" aria-expanded="false" aria-controls="form">
        <span class="avatar" id="ic-c"></span><span><b>Continue as Customer</b><span class="s">File and track a return</span></span><span class="arrow" id="ar-c"></span>
      </button>
      <button class="role" id="role-reviewer" type="button" aria-expanded="false" aria-controls="form">
        <span class="avatar r" id="ic-r"></span><span><b>Continue as Reviewer</b><span class="s">Review escalated cases</span></span><span class="arrow" id="ar-r"></span>
      </button>
    </div>
    <form id="form" hidden novalidate class="rise">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="pw">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false" title="Show password"></button>
      </div>
      <button class="btn block" id="submit" type="submit" style="margin-top:20px">Sign in</button>
      <div id="err" role="alert"></div>
      <div class="demo" id="demo" hidden></div>
    </form>
  </main>
  <p class="foot">Demo build — not for real orders</p>
</div>
<script src="/static/app.js"></script>
<script>
let role = null, demo = [];
$("top").innerHTML = `${brand()}<p>Photo-checked clothing returns, decided in about a minute.</p>`;
$("ic-c").innerHTML = icon("user"); $("ic-r").innerHTML = icon("shield");
$("ar-c").innerHTML = icon("arrow"); $("ar-r").innerHTML = icon("arrow");

function setPasswordVisible(show) {
  $("password").type = show ? "text" : "password";
  $("eye").innerHTML = icon(show ? "eyeOff" : "eye");
  $("eye").setAttribute("aria-pressed", show);
  $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
  $("eye").title = show ? "Hide password" : "Show password";
}
setPasswordVisible(false);
$("eye").onclick = () => { setPasswordVisible($("password").type === "password"); $("password").focus(); };

function choose(r) {
  role = r;
  for (const k of ["customer", "reviewer"]) $("role-" + k).setAttribute("aria-expanded", k === r);
  $("form").hidden = false;
  $("err").innerHTML = "";
  $("submit").textContent = r === "reviewer" ? "Sign in as reviewer" : "Sign in";
  const accounts = demo.filter((a) => a.role === r);
  $("demo").hidden = !accounts.length;
  $("demo").innerHTML = `<span>Demo accounts:</span>` + accounts.map((a) =>
    `<button type="button" data-u="${esc(a.username)}" data-p="${esc(a.password)}">${esc(a.username)}</button>`).join("");
  $("demo").querySelectorAll("button").forEach((b) => b.onclick = () => { $("username").value = b.dataset.u; $("password").value = b.dataset.p; $("submit").focus(); });
  $("username").focus();
}
$("role-customer").onclick = () => choose("customer");
$("role-reviewer").onclick = () => choose("reviewer");

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").innerHTML = "";
  if (!$("username").value.trim() || !$("password").value) {
    $("err").innerHTML = `<div class="error">Enter your username and password.</div>`;
    return;
  }
  $("submit").disabled = true;
  try {
    const u = await postJSON("/api/login", {username: $("username").value.trim(), password: $("password").value, role});
    location.href = u.role === "reviewer" ? "/review" : "/customer";
  } catch (err) {
    $("err").innerHTML = `<div class="error">${esc(err.message)}</div>`;
  } finally { $("submit").disabled = false; }
});

(async () => {
  try { demo = (await api("/api/config")).demo_accounts; } catch { demo = []; }
  const want = new URLSearchParams(location.search).get("role");
  if (want === "customer" || want === "reviewer") choose(want);
})();
</script>
</body>
</html>
